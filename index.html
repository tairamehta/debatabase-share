<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>debatabase</title>
<style>
:root{--paper:#f2f2f2;--rect:#fff;--ink:#111;--ink2:#444;--mute:#777;--line:#c8c8c8;--teal:#0e7c72;--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 16px 64px}
.lab{font-family:var(--mono);font-size:11.5px;color:var(--mute);text-transform:lowercase;letter-spacing:.02em}
h1{font-family:"New York",Georgia,serif;font-weight:400;font-size:26px;line-height:1.3;margin:8px 0 4px}
.rect{background:var(--rect);border:1px solid var(--line);padding:16px;margin-top:16px}
.rect.us{border-left:3px solid var(--teal)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.role{font-size:16px}
audio{width:100%;margin-top:10px;display:block}
details{margin-top:10px}summary{cursor:pointer;font-family:var(--mono);font-size:11.5px;color:var(--teal)}
.tr{white-space:pre-wrap;color:var(--ink2);font-size:14px;margin-top:8px}
.brand{display:flex;align-items:center;gap:8px;margin-bottom:24px}.brand b{font-family:var(--mono);font-weight:500;font-size:13px}
.foot{margin-top:32px}
</style>
</head>
<body><main><div class="brand"><b>debatabase</b></div><div id="page"><span class="lab">loading…</span></div></main>
<script>
const API="https://txuxpumixlntkeoijbhs.supabase.co/functions/v1/share/";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mmss=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
(async()=>{
  const box=document.getElementById("page");
  const token=(location.hash.slice(1)||new URLSearchParams(location.search).get("t")||"").replace(/[^A-Za-z0-9_-]/g,"");
  if(!token){ box.innerHTML=`<span class="lab">no link</span>`; return }
  let r; try{ const res=await fetch(API+token,{headers:{accept:"application/json"}}); r=await res.json(); if(!res.ok) throw new Error(r.error||res.status) }
  catch(e){ box.innerHTML=`<span class="lab">${esc(e.message==="404"?"this link has been turned off":"could not load this round")}</span>`; return }
  document.title=r.motion||"debatabase";
  const date=r.date?new Date(r.date).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"";
  const meta=[r.shared_by?`shared by ${esc(r.shared_by)}`:"",esc(r.round_no),date,r.side?`${esc(r.side)} · us`:"",esc(r.result)].filter(Boolean).join(" · ");
  const cards=(r.speeches||[]).map(s=>`<section class="rect${s.us?" us":""}"><div class="head"><span class="role">${esc(s.who)}</span><span class="lab">${esc(s.team||"")}${s.duration?` · ${mmss(s.duration)}`:""}</span></div>
    ${s.url?`<audio controls preload="none" src="${esc(s.url)}"></audio>`:`<p class="lab">recording not uploaded</p>`}
    ${s.transcript?`<details><summary>transcript</summary><div class="tr">${esc(s.transcript)}</div></details>`:""}</section>`).join("");
  box.innerHTML=`<span class="lab">${meta}</span><h1>${esc(r.motion||"untitled round")}</h1>${cards||`<p class="lab">no speeches yet</p>`}<p class="lab foot">links to the recordings refresh each time this page is opened</p>`;
})();
</script>
</body></html>
